<!-- Byte: mascota de SoftNova. Robot esférico flotante con pantalla LED y módulos de herramientas.
     - Flota, parpadea y la antena titila.
     - Los ojos siguen al puntero del mouse.
     - Al cargar (y al pasar el mouse o tocarlo) saluda con un globo de diálogo y pone cara feliz.
     - Vive en la pantalla de la laptop del hero. Al bajar sale volando a la esquina inferior derecha
       y queda fijo; en cada sección nueva comenta algo. Al volver arriba regresa a la laptop. -->
<div class="sn-byte" id="sn-byte">
  <!-- Mensaje en forma de holograma, proyectado desde la pantalla-cara de Byte -->
  <span class="sn-byte-beam" aria-hidden="true"></span>
  <div class="sn-byte-bubble" role="status">
    <strong class="sn-byte-title">¡Hola! Soy Byte 👋</strong>
    <span class="sn-byte-text">¿Creamos tu web juntos?</span>
  </div>

  <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg" role="img"
    aria-label="Byte, el robot asistente de SoftNova">
    <defs>
      <radialGradient id="sn-byte-pearl" cx="50%" cy="50%" r="55%" fx="34%" fy="28%">
        <stop offset="0%" stop-color="#ffffff" />
        <stop offset="55%" stop-color="#e3eaf7" />
        <stop offset="100%" stop-color="#9fb0d2" />
      </radialGradient>
      <radialGradient id="sn-byte-shadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#22d3ee" stop-opacity=".55" />
        <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
      </radialGradient>
      <filter id="sn-byte-neon" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="2" result="b" />
        <feMerge>
          <feMergeNode in="b" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    </defs>

    <!-- Brillo en el "piso" que acompaña la flotación -->
    <ellipse class="sn-byte-floor" cx="100" cy="206" rx="46" ry="8" fill="url(#sn-byte-shadow)" />

    <g class="sn-byte-body">
      <!-- Antena -->
      <line x1="100" y1="44" x2="100" y2="26" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round" />
      <circle class="sn-byte-tip" cx="100" cy="21" r="6" fill="#22d3ee" filter="url(#sn-byte-neon)" />

      <!-- Esfera blanca perlada -->
      <circle cx="100" cy="105" r="62" fill="url(#sn-byte-pearl)" />
      <ellipse cx="72" cy="66" rx="15" ry="8" fill="#fff" opacity=".8" transform="rotate(-32 72 66)" />

      <!-- Luces laterales -->
      <circle cx="40" cy="108" r="8" fill="#0b1d5a" stroke="#22d3ee" stroke-width="2" />
      <circle class="sn-byte-led" cx="40" cy="108" r="3.5" fill="#22d3ee" filter="url(#sn-byte-neon)" />
      <circle cx="160" cy="108" r="8" fill="#0b1d5a" stroke="#22d3ee" stroke-width="2" />
      <circle class="sn-byte-led" cx="160" cy="108" r="3.5" fill="#22d3ee" filter="url(#sn-byte-neon)" />

      <!-- Franja neón inferior -->
      <path d="M52 140q48 30 96 0" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"
        filter="url(#sn-byte-neon)" opacity=".9" />

      <!-- Bombillitos decorativos entre la pantalla y la franja neón -->
      <g class="sn-byte-bulbs" filter="url(#sn-byte-neon)">
        <circle cx="78" cy="138" r="4" fill="#0b1d5a" stroke="#94a3b8" stroke-opacity=".5" />
        <circle class="sn-byte-bulb" cx="78" cy="138" r="2.6" fill="#22d3ee" style="--d: 0s;" />
        <circle cx="89" cy="140.5" r="4" fill="#0b1d5a" stroke="#94a3b8" stroke-opacity=".5" />
        <circle class="sn-byte-bulb" cx="89" cy="140.5" r="2.6" fill="#4ade80" style="--d: .3s;" />
        <circle cx="100" cy="141.5" r="4" fill="#0b1d5a" stroke="#94a3b8" stroke-opacity=".5" />
        <circle class="sn-byte-bulb" cx="100" cy="141.5" r="2.6" fill="#fbbf24" style="--d: .6s;" />
        <circle cx="111" cy="140.5" r="4" fill="#0b1d5a" stroke="#94a3b8" stroke-opacity=".5" />
        <circle class="sn-byte-bulb" cx="111" cy="140.5" r="2.6" fill="#a78bfa" style="--d: .9s;" />
        <circle cx="122" cy="138" r="4" fill="#0b1d5a" stroke="#94a3b8" stroke-opacity=".5" />
        <circle class="sn-byte-bulb" cx="122" cy="138" r="2.6" fill="#22d3ee" style="--d: 1.2s;" />
      </g>

      <!-- Pantalla LED -->
      <rect class="sn-byte-screen-led" x="58" y="72" width="84" height="56" rx="24" fill="#050a22" stroke="#22d3ee"
        stroke-opacity=".55" stroke-width="2" />
      <g class="sn-byte-face" filter="url(#sn-byte-neon)">
        <g class="sn-byte-eyes">
          <!-- Ojos normales -->
          <g class="sn-byte-open">
            <rect class="sn-byte-eye" x="77" y="87" width="12" height="17" rx="6" fill="#22d3ee" />
            <rect class="sn-byte-eye sn-byte-eye-r" x="111" y="87" width="12" height="17" rx="6" fill="#22d3ee" />
          </g>
          <!-- Ojos felices ^ ^ -->
          <g class="sn-byte-happy" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round">
            <path d="M76 99q7-10 14 0" />
            <path d="M110 99q7-10 14 0" />
          </g>
        </g>
        <path d="M89 113q11 8 22 0" fill="none" stroke="#22d3ee" stroke-width="3.5" stroke-linecap="round" />
      </g>
      <!-- Pantalla de actualización: cada minuto Byte "se actualiza" (texto + barra hasta 100%) -->
      <g class="sn-byte-update" aria-hidden="true">
        <text class="sn-byte-update-label" x="100" y="94" text-anchor="middle">actualizando<tspan class="sn-byte-dots">...</tspan></text>
        <rect x="72" y="99" width="56" height="7" rx="3.5" fill="#0b1d5a" stroke="#22d3ee" stroke-opacity=".6" />
        <rect class="sn-byte-update-bar" x="73.5" y="100.5" width="0" height="4" rx="2" fill="#22d3ee"
          filter="url(#sn-byte-neon)" />
        <text class="sn-byte-update-pct" x="100" y="117" text-anchor="middle">0%</text>
      </g>
      <!-- Teclado y manitos: aparecen mientras Byte "se actualiza" y tipea -->
      <g class="sn-byte-typing" aria-hidden="true">
        <g class="sn-byte-keyboard">
          <rect x="60" y="175" width="80" height="20" rx="5" fill="#0f1d5c" stroke="#22d3ee" stroke-opacity=".8" />
          <rect class="sn-byte-key" x="64.5" y="177.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="74.8" y="177.5" width="8" height="4.5" rx="1.2" style="--d: 0s;" />
          <rect class="sn-byte-key" x="85.1" y="177.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key" x="95.4" y="177.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="105.7" y="177.5" width="8" height="4.5" rx="1.2" style="--d: .35s;" />
          <rect class="sn-byte-key" x="116.0" y="177.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="126.3" y="177.5" width="8" height="4.5" rx="1.2" style="--d: .7s;" />
          <rect class="sn-byte-key" x="64.5" y="183.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key" x="74.8" y="183.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="85.1" y="183.5" width="8" height="4.5" rx="1.2" style="--d: .15s;" />
          <rect class="sn-byte-key" x="95.4" y="183.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key" x="105.7" y="183.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="116.0" y="183.5" width="8" height="4.5" rx="1.2" style="--d: .5s;" />
          <rect class="sn-byte-key" x="126.3" y="183.5" width="8" height="4.5" rx="1.2" />
          <rect class="sn-byte-key is-lit" x="82" y="189.5" width="36" height="3.5" rx="1.5" style="--d: .25s;" />
        </g>
        <ellipse class="sn-byte-hand" cx="84" cy="177" rx="7" ry="5.5" fill="url(#sn-byte-pearl)" stroke="#22d3ee"
          stroke-opacity=".6" transform="rotate(-12 84 177)" />
        <ellipse class="sn-byte-hand sn-byte-hand-r" cx="116" cy="177" rx="7" ry="5.5" fill="url(#sn-byte-pearl)"
          stroke="#22d3ee" stroke-opacity=".6" transform="rotate(12 116 177)" />
      </g>
    </g>

    <!-- Módulos de herramientas flotantes -->
    <!-- Pincel de diseño (oculto)
    <g class="sn-byte-tool" style="--d: 0s; --r: -8deg;">
      <rect x="2" y="44" width="36" height="36" rx="10" fill="#0f1d5c" stroke="#22d3ee" stroke-opacity=".8" />
      <path d="M28 52 17 63" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />
      <path d="M17 63c-4 0-6 3-6 7 0 1-1 2-2 2 2 2 4 2 6 2 4 0 6-3 6-6Z" fill="#a78bfa" />
    </g>-->
    <!-- Botón actualizar: al tocarlo Byte se actualiza (teclado, manitos y barra de carga) -->
    <g class="sn-byte-tool sn-byte-cursor" style="--d: -1.4s; --r: 8deg;">
      <title>Actualizar a Byte</title>
      <rect class="sn-byte-cursor-box" x="164" y="40" width="34" height="34" rx="10" fill="#0f1d5c" stroke="#22d3ee"
        stroke-opacity=".8" />
      <!-- Ícono de actualizar: flecha circular (gira mientras se actualiza) -->
      <g class="sn-byte-refresh" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M189 57a8 8 0 1 1-2.34-5.66" />
        <path d="M187.5 45.8v5.9h-5.9" />
      </g>
    </g>
    <!-- Servidor de datos 
    <g class="sn-byte-tool" style="--d: -2.6s; --r: -6deg;">
      <rect x="160" y="150" width="36" height="38" rx="10" fill="#0f1d5c" stroke="#22d3ee" stroke-opacity=".8" />
      <rect x="168" y="157" width="20" height="9" rx="2.5" fill="#1e3a8a" />
      <rect x="168" y="169" width="20" height="9" rx="2.5" fill="#1e3a8a" />
      <circle class="sn-byte-blink" cx="172.5" cy="161.5" r="1.8" fill="#4ade80" />
      <circle class="sn-byte-blink" cx="172.5" cy="173.5" r="1.8" fill="#4ade80" style="animation-delay: .5s;" />
      <rect x="177" y="160.5" width="8" height="2" rx="1" fill="#60a5fa" />
      <rect x="177" y="172.5" width="8" height="2" rx="1" fill="#60a5fa" />
    </g>-->
  </svg>
</div>

<style>
  .sn-byte {
    position: relative;
    width: 100%;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* Con JS, Byte vive fijo en la pantalla y se posiciona con transform */
  .sn-byte.is-live {
    position: fixed;
    left: 0;
    top: 0;
    z-index: 40;
    will-change: transform;
  }

  /* Vuelo entre el hero y la esquina */
  .sn-byte.is-moving {
    transition: transform .9s cubic-bezier(0.65, 0, 0.35, 1), width .9s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .sn-byte.is-moving svg {
    animation: sn-byte-fly .9s ease-in-out;
  }

  /* Pantalla de la laptop donde vive Byte (estilos propios: no dependen de clases nuevas de Tailwind) */
  .sn-laptop-screen.sn-byte-screen {
    overflow: visible; /* que no se recorten el globo ni las herramientas */
  }

  /* Escenario del hero donde vive Byte: deja lugar arriba para el holograma
     así no se encima con los botones */
  .sn-byte-stage {
    position: relative;
    height: 215px;
  }

  @media (min-width: 640px) {
    .sn-byte-stage { height: auto; aspect-ratio: 16 / 10; }
  }

  .sn-byte-stage .sn-byte-home { top: 64%; }

  .sn-byte-home {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 20;
    width: 34%;
    aspect-ratio: 200 / 220;
    transform: translate(-50%, -48%);
  }

  .sn-byte-screen-glow {
    position: absolute;
    left: 50%;
    top: 52%;
    width: 46%;
    aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(34, 211, 238, .35) 0%, rgba(29, 108, 242, .15) 45%, transparent 70%);
    animation: sn-byte-screen-pulse 4s ease-in-out infinite;
  }

  .sn-byte-screen-away {
    position: absolute;
    inset: auto 0 12% 0;
    text-align: center;
    font: 600 11px/1.4 ui-monospace, monospace;
    color: #67e8f9;
    opacity: 0;
    transition: opacity .15s ease;
  }

  .sn-byte-screen-away span {
    animation: sn-byte-glow 1s steps(1) infinite;
  }

  .sn-byte-screen.is-empty .sn-byte-screen-away {
    opacity: 1;
    transition: opacity .4s ease .5s;
  }

  @keyframes sn-byte-screen-pulse {
    50% { transform: translate(-50%, -50%) scale(1.12); opacity: .7; }
  }

  @keyframes sn-byte-fly {
    30% { transform: rotate(-14deg) scale(1.08); }
    70% { transform: rotate(8deg); }
  }

  .sn-byte svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  /* Mensaje holograma: panel de vidrio azul proyectado desde la cara de Byte */
  .sn-byte-bubble {
    position: absolute;
    right: 40%;
    bottom: 90%;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: max-content;
    max-width: 220px;
    padding: 11px 15px 12px;
    overflow: hidden;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.35;
    color: #e0f2fe;
    text-shadow: 0 0 8px rgba(103, 232, 249, .7);
    background:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, .05) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, rgba(12, 74, 110, .96) 0%, rgba(8, 47, 73, .97) 60%, rgba(4, 22, 48, .98) 100%);
    border: 1px solid rgba(103, 232, 249, .85);
    box-shadow:
      0 0 0 1px rgba(34, 211, 238, .15),
      0 0 28px -2px rgba(34, 211, 238, .55),
      inset 0 0 22px rgba(103, 232, 249, .25);
    opacity: 0;
    transform: translate(18%, 40%) scale(.15);
    transform-origin: 100% 100%;
    transition: opacity .3s ease, transform .55s cubic-bezier(0.34, 1.4, 0.64, 1);
    pointer-events: none;
  }

  .sn-byte-bubble strong {
    color: #fff;
    font-weight: 700;
  }

  /* Línea de escaneo que recorre el holograma */
  .sn-byte-bubble::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: -30%;
    height: 30%;
    background: linear-gradient(180deg, transparent, rgba(165, 243, 252, .35), transparent);
    animation: sn-byte-scan 2.4s linear infinite;
  }

  /* Brillo en la esquina, como reflejo en el vidrio */
  .sn-byte-bubble::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, rgba(255, 255, 255, .22) 0%, transparent 35%);
    pointer-events: none;
  }

  .sn-byte.is-talking .sn-byte-bubble {
    opacity: 1;
    transform: none;
    animation: sn-byte-flicker 3.5s linear .6s infinite;
  }

  /* Haz de luz que sale de la cara hacia el holograma */
  .sn-byte-beam {
    position: absolute;
    left: -40%;
    right: 40%;
    top: 9%;
    height: 25%;
    background: linear-gradient(0deg, rgba(165, 243, 252, .95) 0%, rgba(34, 211, 238, .55) 55%, rgba(34, 211, 238, .15) 100%);
    clip-path: polygon(25% 0, 100% 0, 96% 100%, 72% 100%);
    filter: blur(.6px) drop-shadow(0 0 6px rgba(34, 211, 238, .8));
    mix-blend-mode: screen;
    opacity: 0;
    transform: scaleY(0);
    transform-origin: 90% 100%;
    transition: opacity .25s ease, transform .35s ease-out;
    pointer-events: none;
  }

  .sn-byte.is-talking .sn-byte-beam {
    opacity: 1;
    transform: none;
    animation: sn-byte-beam 1.8s ease-in-out .4s infinite;
  }

  /* La pantalla-cara brilla más mientras proyecta */
  .sn-byte-screen-led {
    transition: stroke-opacity .3s ease, stroke-width .3s ease;
  }

  .sn-byte.is-talking .sn-byte-screen-led {
    stroke-opacity: 1;
    stroke-width: 3;
  }

  @keyframes sn-byte-scan {
    to { top: 100%; }
  }

  @keyframes sn-byte-flicker {
    0%, 44%, 48%, 100% { opacity: 1; }
    45% { opacity: .82; }
    46% { opacity: .95; }
    47% { opacity: .88; }
  }

  @keyframes sn-byte-beam {
    50% { opacity: .55; }
  }

  /* Flotación */
  .sn-byte-body {
    animation: sn-byte-float 4s ease-in-out infinite;
  }

  .sn-byte-floor {
    transform-box: fill-box;
    transform-origin: center;
    animation: sn-byte-floor 4s ease-in-out infinite;
  }

  .sn-byte-tip {
    animation: sn-byte-glow 1.6s ease-in-out infinite;
  }

  .sn-byte-led {
    animation: sn-byte-glow 2.4s ease-in-out infinite;
  }

  .sn-byte-blink {
    animation: sn-byte-glow 1s steps(1) infinite;
  }

  .sn-byte-tool {
    transform-box: fill-box;
    transform-origin: center;
    animation: sn-byte-tool 5s ease-in-out infinite;
    animation-delay: var(--d);
  }

  /* Ojos: parpadeo y seguimiento del puntero (JS mueve .sn-byte-eyes) */
  .sn-byte-eyes {
    transition: transform .25s ease-out;
  }

  .sn-byte-eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: sn-byte-blink 4.5s ease-in-out infinite;
  }

  .sn-byte-happy {
    opacity: 0;
  }

  .sn-byte-open,
  .sn-byte-happy {
    transition: opacity .2s ease;
  }

  .sn-byte.is-happy .sn-byte-open {
    opacity: 0;
  }

  .sn-byte.is-happy .sn-byte-happy {
    opacity: 1;
  }

  /* Bombillitos: se encienden en secuencia, como luces de estado */
  .sn-byte-bulb {
    animation: sn-byte-bulb 1.8s ease-in-out infinite;
    animation-delay: var(--d);
  }

  /* Mientras se actualiza titilan rápido */
  .sn-byte.is-updating .sn-byte-bulb {
    animation-duration: .5s;
  }

  @keyframes sn-byte-bulb {
    0%, 100% { opacity: .45; }
    35% { opacity: 1; }
  }

  /* Cuadrito del cursor: se puede tocar para que Byte se actualice */
  .sn-byte-cursor {
    cursor: pointer;
  }

  .sn-byte-cursor-box {
    transition: fill .2s ease, stroke-opacity .2s ease;
  }

  .sn-byte-cursor:hover .sn-byte-cursor-box,
  .sn-byte.is-updating .sn-byte-cursor-box {
    fill: #1d4ed8;
    stroke-opacity: 1;
  }

  .sn-byte-refresh {
    transform-box: fill-box;
    transform-origin: center;
  }

  .sn-byte.is-updating .sn-byte-refresh {
    animation: sn-byte-spin .9s linear infinite;
  }

  @keyframes sn-byte-spin {
    to { transform: rotate(360deg); }
  }

  .sn-byte-cursor.is-pressed .sn-byte-cursor-box {
    fill: #22d3ee;
  }

  /* Teclado y manitos: salen de abajo de Byte mientras se actualiza */
  .sn-byte-typing {
    opacity: 0;
    transform: translateY(-16px) scale(.5);
    transform-box: fill-box;
    transform-origin: 50% 0;
    transition: opacity .2s ease, transform .4s cubic-bezier(0.34, 1.5, 0.64, 1);
    pointer-events: none;
  }

  .sn-byte.is-updating .sn-byte-typing {
    opacity: 1;
    transform: none;
  }

  .sn-byte-key {
    fill: #1e3a8a;
  }

  /* Teclas que se iluminan al "presionarlas" */
  .sn-byte.is-updating .sn-byte-key.is-lit {
    animation: sn-byte-key .9s steps(1) infinite;
    animation-delay: var(--d);
  }

  /* Manitos tipeando, alternadas */
  .sn-byte.is-updating .sn-byte-hand {
    animation: sn-byte-type .32s ease-in-out infinite alternate;
  }

  .sn-byte.is-updating .sn-byte-hand-r {
    animation-delay: -.16s;
  }

  @keyframes sn-byte-key {
    0% { fill: #67e8f9; }
    30% { fill: #1e3a8a; }
  }

  @keyframes sn-byte-type {
    from { translate: 0 -4px; }
    to { translate: 0 1px; }
  }

  /* Modo "actualizando": la cara se apaga y aparece la barra de carga */
  .sn-byte-face {
    transition: opacity .25s ease;
  }

  .sn-byte-update {
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }

  .sn-byte.is-updating .sn-byte-face {
    opacity: 0;
  }

  .sn-byte.is-updating .sn-byte-update {
    opacity: 1;
  }

  .sn-byte-update-label,
  .sn-byte-update-pct {
    fill: #67e8f9;
    font: 700 7.2px ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .02em;
  }

  .sn-byte-update-pct {
    font-size: 9px;
    fill: #e0f2fe;
  }

  .sn-byte-dots {
    animation: sn-byte-glow 1s steps(1) infinite;
  }

  .sn-byte.is-updated .sn-byte-update-pct {
    fill: #4ade80;
  }

  /* Al saludar da un saltito */
  .sn-byte.is-hop svg {
    animation: sn-byte-hop .6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes sn-byte-float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  @keyframes sn-byte-floor {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(.75); opacity: .6; }
  }

  @keyframes sn-byte-glow {
    50% { opacity: .35; }
  }

  @keyframes sn-byte-tool {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-9px) rotate(var(--r)); }
  }

  @keyframes sn-byte-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(.1); }
  }

  @keyframes sn-byte-hop {
    40% { transform: translateY(-14px) scale(1.04); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sn-byte *,
    .sn-byte *::before,
    .sn-byte.is-hop svg {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<script>
  // Espera a que exista toda la página: Byte vigila secciones que están más abajo en el HTML
  document.addEventListener('DOMContentLoaded', function () {
    var byte = document.getElementById('sn-byte');
    var anchor = document.getElementById('sn-byte-anchor');
    if (!byte) return;
    var svg = byte.querySelector('svg');
    var eyes = byte.querySelector('.sn-byte-eyes');
    var titleEl = byte.querySelector('.sn-byte-title');
    var textEl = byte.querySelector('.sn-byte-text');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var talkTimer = null;

    // Lo que dice Byte en cada sección (se muestra la primera vez que se llega)
    var messages = {
      inicio: ['¡Hola! Soy Byte 👋', '¿Creamos tu web juntos?'],
      destacados: ['¡Mirá esto! ✨', 'Soluciones que hacen crecer tu negocio.'],
      servicios: ['Esto es lo que hacemos 🚀', 'Elegí lo que tu negocio necesita.'],
      proceso: ['Paso a paso 🧩', 'Te acompañamos de la idea al lanzamiento.'],
      nosotros: ['Somos SoftNova 💙', 'Un equipo cercano y apasionado.'],
      contacto: ['¡Escribinos! ✉️', 'Te respondemos a la brevedad.']
    };
    var current = 'inicio';
    var seen = { inicio: true };

    // Saluda: globo + cara feliz + saltito
    function say(id, ms) {
      var m = messages[id] || messages.inicio;
      titleEl.textContent = m[0];
      textEl.textContent = m[1];
      clearTimeout(talkTimer);
      stopUpdate();
      byte.classList.add('is-talking', 'is-happy');
      byte.classList.remove('is-hop');
      void byte.offsetWidth;
      byte.classList.add('is-hop');
      talkTimer = setTimeout(function () {
        byte.classList.remove('is-talking', 'is-happy');
      }, ms || 4500);
    }

    setTimeout(function () { say('inicio', 5500); }, 1200);

    // ---- Cada minuto Byte "se actualiza": muestra "actualizando..." y una barra hasta 100% ----
    var updBar = byte.querySelector('.sn-byte-update-bar');
    var updPct = byte.querySelector('.sn-byte-update-pct');
    var updTimer = null;
    var BAR_W = 53;

    function stopUpdate() {
      clearTimeout(updTimer);
      byte.classList.remove('is-updating', 'is-updated');
    }

    // force: lo pidió el usuario tocando el cursor (corta el mensaje que esté mostrando)
    function runUpdate(force) {
      if (byte.classList.contains('is-updating')) return;
      if (force === true) {
        clearTimeout(talkTimer);
        byte.classList.remove('is-talking', 'is-happy');
      } else if (document.hidden || byte.classList.contains('is-talking')) {
        // Automático: no interrumpe un mensaje ni corre con la pestaña oculta
        return;
      }
      var pct = 0;
      updBar.setAttribute('width', 0);
      updPct.textContent = '0%';
      byte.classList.remove('is-updated');
      byte.classList.add('is-updating');
      (function step() {
        // Avance irregular, como una carga real
        pct = Math.min(100, pct + 2 + Math.floor(Math.random() * 7));
        updBar.setAttribute('width', (BAR_W * pct / 100).toFixed(1));
        updPct.textContent = pct + '%';
        if (pct < 100) {
          updTimer = setTimeout(step, 70 + Math.random() * 160);
        } else {
          byte.classList.add('is-updated');
          updTimer = setTimeout(stopUpdate, 1200);
        }
      })();
    }

    setInterval(runUpdate, 60000);

    var cursorBtn = byte.querySelector('.sn-byte-cursor');
    if (cursorBtn) {
      cursorBtn.addEventListener('click', function (e) {
        e.stopPropagation(); // que no dispare el saludo de Byte
        cursorBtn.classList.add('is-pressed');
        setTimeout(function () { cursorBtn.classList.remove('is-pressed'); }, 180);
        runUpdate(true);
      });
    }

    // Pasar el mouse o tocarlo lo hace saludar (salvo mientras se actualiza)
    function greet() {
      if (!byte.classList.contains('is-updating')) say(current);
    }
    byte.addEventListener('mouseenter', greet);
    byte.addEventListener('click', greet);

    // ---- Acompañar al usuario mientras navega ----
    // En el hero, Byte vive dentro de su lugar (#sn-byte-anchor) y se desplaza con la página.
    // Al bajar, pasa a estar fijo en la pantalla y vuela a la esquina inferior derecha.
    if (anchor) {
      var docked = false;
      var moveTimer = null;
      var ticking = false;

      // Tamaño y lugar en la esquina inferior derecha
      function dockBox() {
        var w = window.innerWidth < 640 ? 76 : 104;
        var m = window.innerWidth < 640 ? 12 : 24;
        return { x: window.innerWidth - w - m, y: window.innerHeight - w * 1.1 - m, w: w };
      }

      function place(box) {
        byte.style.width = box.w + 'px';
        byte.style.transform = 'translate(' + box.x + 'px,' + box.y + 'px)';
      }

      function anchorBox() {
        var r = anchor.getBoundingClientRect();
        return { x: r.left, y: r.top, w: r.width };
      }

      function fly(to, done) {
        clearTimeout(moveTimer);
        if (reduced) { place(to); if (done) done(); return; }
        void byte.offsetWidth;
        byte.classList.add('is-moving');
        place(to);
        moveTimer = setTimeout(function () {
          byte.classList.remove('is-moving');
          if (done) done();
        }, 950);
      }

      var screen = document.querySelector('.sn-byte-screen');

      function dock(animate) {
        docked = true;
        if (screen) screen.classList.add('is-empty');
        byte.classList.remove('is-talking', 'is-happy');
        var from = byte.parentNode === anchor ? anchorBox() : null;
        if (byte.parentNode !== document.body) document.body.appendChild(byte);
        byte.classList.add('is-live');
        if (from && animate) {
          place(from);
          fly(dockBox(), sayPending);
        } else {
          place(dockBox());
          sayPending();
        }
      }

      // Si llegó a una sección nueva mientras volaba, la comenta al aterrizar
      var pending = null;
      function sayPending() {
        if (pending && docked) say(pending);
        pending = null;
      }

      function undock() {
        docked = false;
        byte.classList.remove('is-talking', 'is-happy');
        if (screen) screen.classList.remove('is-empty');
        fly(anchorBox(), function () {
          if (docked) return;
          // Vuelve a quedar dentro del hero
          byte.classList.remove('is-live');
          byte.style.width = '';
          byte.style.transform = '';
          anchor.appendChild(byte);
        });
      }

      function update() {
        ticking = false;
        var shouldDock = anchor.getBoundingClientRect().bottom < 100;
        if (shouldDock && !docked) dock(true);
        else if (!shouldDock && docked) undock();
        else if (docked && !byte.classList.contains('is-moving')) place(dockBox());
        else if (!docked && byte.classList.contains('is-moving')) place(anchorBox());
      }

      function requestUpdate() {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      }

      window.addEventListener('scroll', requestUpdate, { passive: true });
      window.addEventListener('resize', requestUpdate);
      // Si la página se abre ya scrolleada, aparece directo en la esquina
      if (anchor.getBoundingClientRect().bottom < 100) dock(false);

    // Comenta algo al entrar en cada sección nueva
      var sectionObserver = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          current = entry.target.id;
          if (seen[current] || !messages[current]) return;
          seen[current] = true;
          if (docked && !byte.classList.contains('is-moving')) {
            var id = current;
            setTimeout(function () { say(id); }, reduced ? 0 : 400);
          } else {
            pending = current;
          }
        });
      }, { rootMargin: '-45% 0px -45% 0px' });
      Object.keys(messages).forEach(function (id) {
        var el = document.getElementById(id);
        if (el) sectionObserver.observe(el);
      });
    }

    // Los ojos siguen al puntero (máximo 5 unidades del SVG)
    if (reduced) return;
    var frame = null;
    window.addEventListener('pointermove', function (e) {
      if (frame) return;
      frame = requestAnimationFrame(function () {
        frame = null;
        var r = svg.getBoundingClientRect();
        var cx = r.left + r.width / 2;
        var cy = r.top + r.height * 0.45;
        var dx = e.clientX - cx;
        var dy = e.clientY - cy;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var k = Math.min(dist / 200, 1) * 5;
        eyes.style.transform = 'translate(' + (dx / dist * k).toFixed(2) + 'px,' + (dy / dist * k * 0.7).toFixed(2) + 'px)';
      });
    }, { passive: true });
  });
</script>
