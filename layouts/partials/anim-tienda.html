<!-- Ilustración animada: tienda online (diapositiva del carrusel).
     Secuencia: el cursor agrega un producto → el producto vuela al carrito → sube el total →
     toca "Comprar" → aparece "Pedido recibido".
     Las animaciones arrancan desde cero cada vez que la diapositiva se activa (.is-active). -->
<div class="sn-to sn-slide-anim mx-auto w-full" aria-hidden="true">
  <svg viewBox="0 0 460 360" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="sn-to-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2563eb" stop-opacity=".30" />
        <stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
      </radialGradient>
      <linearGradient id="sn-to-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1fb6ff" />
        <stop offset="100%" stop-color="#1d5cf2" />
      </linearGradient>
      <linearGradient id="sn-to-p1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1e3a8a" />
        <stop offset="100%" stop-color="#172554" />
      </linearGradient>
      <linearGradient id="sn-to-p2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#4c1d95" />
        <stop offset="100%" stop-color="#2e1065" />
      </linearGradient>
      <linearGradient id="sn-to-p3" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#14532d" />
        <stop offset="100%" stop-color="#052e16" />
      </linearGradient>
    </defs>

    <!-- Halo de fondo -->
    <circle cx="230" cy="175" r="175" fill="url(#sn-to-glow)" />

    <!-- Ventana del navegador -->
    <g class="sn-to-window">
      <rect x="40" y="40" width="340" height="250" rx="14" fill="#0a1440" stroke="#1e40af" stroke-opacity=".8" />
      <line x1="40" y1="72" x2="380" y2="72" stroke="#1e40af" stroke-opacity=".6" />
      <circle cx="60" cy="56" r="4" fill="#ef4444" opacity=".8" />
      <circle cx="76" cy="56" r="4" fill="#f59e0b" opacity=".8" />
      <circle cx="92" cy="56" r="4" fill="#22c55e" opacity=".8" />
      <rect x="120" y="49" width="190" height="14" rx="7" fill="#111d55" />
      <text x="215" y="59" text-anchor="middle" font-family="ui-monospace, monospace" font-size="8"
        fill="#64748b">https://tunegocio.uy/tienda</text>

      <!-- Encabezado de la tienda -->
      <rect x="56" y="84" width="16" height="16" rx="5" fill="url(#sn-to-grad)" />
      <text x="78" y="96" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">Mi Tienda</text>
      <rect x="180" y="90" width="26" height="4" rx="2" fill="#475569" />
      <rect x="214" y="90" width="26" height="4" rx="2" fill="#475569" />
      <rect x="248" y="90" width="26" height="4" rx="2" fill="#475569" />

      <!-- Carrito -->
      <g class="sn-to-cart">
        <path d="M336 85h3l2.5 11h10l2-7.5h-13.5" fill="none" stroke="#cbd5e1" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="343" cy="100" r="1.6" fill="#cbd5e1" />
        <circle cx="350" cy="100" r="1.6" fill="#cbd5e1" />
      </g>
      <g class="sn-to-count">
        <circle cx="357" cy="83" r="6.5" fill="#22c55e" />
        <text x="357" y="86" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="800"
          fill="#fff">1</text>
      </g>

      <!-- Productos -->
      <!-- 1: auriculares -->
      <rect x="56" y="112" width="96" height="120" rx="8" fill="#13205e" stroke="#1e40af" stroke-opacity=".6" />
      <rect x="62" y="118" width="84" height="56" rx="6" fill="url(#sn-to-p1)" />
      <path d="M92 152v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" />
      <rect x="88" y="148" width="7" height="12" rx="3" fill="#60a5fa" />
      <rect x="113" y="148" width="7" height="12" rx="3" fill="#60a5fa" />
      <rect x="62" y="181" width="56" height="5" rx="2.5" fill="#475569" />
      <text x="62" y="198" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">$ 890</text>
      <rect x="62" y="206" width="84" height="18" rx="6" fill="#1e2a6b" />
      <text x="104" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1">Agregar</text>

      <!-- 2: zapatilla (la que se compra) -->
      <rect class="sn-to-card" x="162" y="112" width="96" height="120" rx="8" fill="#13205e" stroke="#1e40af"
        stroke-opacity=".6" />
      <rect x="168" y="118" width="84" height="56" rx="6" fill="url(#sn-to-p2)" />
      <path d="M186 158v-14l8 2 6 6 18 3a5 5 0 0 1 5 5v1Z" fill="#a78bfa" />
      <rect x="185" y="157" width="39" height="4" rx="2" fill="#ede9fe" />
      <rect x="168" y="181" width="60" height="5" rx="2.5" fill="#475569" />
      <text x="168" y="198" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">$ 1.290</text>
      <rect x="168" y="206" width="84" height="18" rx="6" fill="#1e2a6b" />
      <text x="210" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1">Agregar</text>
      <g class="sn-to-added">
        <rect x="168" y="206" width="84" height="18" rx="6" fill="url(#sn-to-grad)" />
        <path d="m190 215 2.5 2.5 5-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" />
        <text x="203" y="218" font-family="Inter, sans-serif" font-size="8" font-weight="700" fill="#fff">Agregado</text>
      </g>

      <!-- 3: planta -->
      <rect x="268" y="112" width="96" height="120" rx="8" fill="#13205e" stroke="#1e40af" stroke-opacity=".6" />
      <rect x="274" y="118" width="84" height="56" rx="6" fill="url(#sn-to-p3)" />
      <path d="M316 150c-10-2-14-10-12-18 8 1 12 8 12 18Zm0 0c8-3 12-10 10-17-7 2-10 9-10 17Z" fill="#4ade80" />
      <path d="M307 150h18l-3 14h-12Z" fill="#f59e0b" />
      <rect x="274" y="181" width="50" height="5" rx="2.5" fill="#475569" />
      <text x="274" y="198" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#e2e8f0">$ 650</text>
      <rect x="274" y="206" width="84" height="18" rx="6" fill="#1e2a6b" />
      <text x="316" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1">Agregar</text>

      <!-- Total y botón Comprar -->
      <line x1="56" y1="242" x2="364" y2="242" stroke="#1e40af" stroke-opacity=".4" />
      <text x="56" y="266" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Total</text>
      <text class="sn-to-total0" x="86" y="266" font-family="Inter, sans-serif" font-size="11" font-weight="800"
        fill="#e2e8f0">$ 0</text>
      <text class="sn-to-total1" x="86" y="266" font-family="Inter, sans-serif" font-size="11" font-weight="800"
        fill="#4ade80">$ 1.290</text>
      <g class="sn-to-btn">
        <rect x="280" y="250" width="84" height="26" rx="8" fill="#1d4ed8" />
        <text x="322" y="266" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700"
          fill="#fff">Comprar</text>
      </g>
    </g>

    <!-- Producto volando al carrito -->
    <g class="sn-to-fly">
      <circle r="13" fill="url(#sn-to-p2)" stroke="#a78bfa" stroke-width="1.5" />
      <path d="M-7 4v-8l3 1 2.5 2.5 7 1.2a2 2 0 0 1 2 2V4Z" fill="#a78bfa" />
    </g>

    <!-- Ondas de clic -->
    <circle class="sn-to-ripple" cx="210" cy="215" r="14" style="--d: 0.95s;" />
    <circle class="sn-to-ripple" cx="322" cy="263" r="14" style="--d: 3.05s;" />

    <!-- Cursor -->
    <g class="sn-to-cursor">
      <path d="M0 0v16l4.5-4 3 6.5 2.5-1-3-6.5h5.5Z" fill="#fff" stroke="#0a1440" stroke-width="1.2"
        stroke-linejoin="round" />
    </g>

    <!-- Confirmación del pedido -->
    <g class="sn-to-toast">
      <rect x="236" y="276" width="186" height="50" rx="12" fill="#0f1d5c" stroke="#22c55e" stroke-opacity=".7" />
      <circle cx="260" cy="301" r="12" fill="#22c55e" />
      <path d="M254 296h2l1.5 7h7l1.3-5h-9" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" />
      <circle cx="258.5" cy="306" r="1.2" fill="#fff" />
      <circle cx="263.5" cy="306" r="1.2" fill="#fff" />
      <text x="282" y="297" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#e2e8f0">¡Pedido
        recibido!</text>
      <text x="282" y="312" font-family="Inter, sans-serif" font-size="8.5" fill="#94a3b8">Pedido #1024 · $ 1.290</text>
    </g>

    <!-- Etiquetas flotantes -->
    <g class="sn-to-bob" style="--d: 0s;">
      <rect x="-6" y="-2" width="90" height="34" rx="10" fill="#0f1d5c" stroke="#3b82f6" stroke-opacity=".8" />
      <g class="sn-to-truck">
        <path d="M5 8h13v12H5Zm13 4h5l3 4v4h-8Z" fill="#60a5fa" />
        <circle cx="9" cy="21" r="2.5" fill="#0f1d5c" stroke="#60a5fa" stroke-width="1.5" />
        <circle cx="22" cy="21" r="2.5" fill="#0f1d5c" stroke="#60a5fa" stroke-width="1.5" />
      </g>
      <text x="34" y="18" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">Envíos</text>
    </g>    
    <g class="sn-to-badge">
      <rect x="350" y="6" width="96" height="36" rx="10" fill="#0f1d5c" stroke="#22c55e" stroke-opacity=".6" />
      <text x="368" y="28" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4ade80">+1</text>
      <text x="388" y="28" font-family="Inter, sans-serif" font-size="9" fill="#cbd5e1">venta hoy</text>
    </g>
  </svg>
</div>

<style>
  .sn-to {
    max-width: 520px;
  }

  .sn-to svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .sn-to-window {
    filter: drop-shadow(0 0 28px rgba(37, 99, 235, .35));
  }

  .sn-to-added,
  .sn-to-count,
  .sn-to-total1,
  .sn-to-toast,
  .sn-to-badge,
  .sn-to-ripple,
  .sn-to-cursor,
  .sn-to-fly {
    opacity: 0;
  }

  .sn-to-added,
  .sn-to-count,
  .sn-to-cart,
  .sn-to-total0,
  .sn-to-total1,
  .sn-to-btn,
  .sn-to-toast,
  .sn-to-badge,
  .sn-to-ripple {
    transform-box: fill-box;
    transform-origin: center;
  }

  .sn-to-total0,
  .sn-to-total1 {
    transform-origin: left center;
  }

  .sn-to-ripple {
    fill: none;
    stroke: #38bdf8;
    stroke-width: 2;
  }

  /* Todo corre en un ciclo de 6.5s, lo que dura cada diapositiva */
  .is-active .sn-to-window {
    animation: sn-to-float 7s ease-in-out infinite;
  }

  .is-active .sn-to-cursor {
    animation: sn-to-cursor 6.5s ease-in-out infinite;
  }

  .is-active .sn-to-card {
    animation: sn-to-card 6.5s ease-out infinite;
  }

  .is-active .sn-to-added {
    animation: sn-to-added 6.5s ease-out infinite;
  }

  .is-active .sn-to-fly {
    animation: sn-to-fly 6.5s ease-in-out infinite;
  }

  .is-active .sn-to-cart {
    animation: sn-to-cart 6.5s ease-in-out infinite;
  }

  .is-active .sn-to-count {
    animation: sn-to-count 6.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  .is-active .sn-to-total0 {
    animation: sn-to-total0 6.5s ease-out infinite;
  }

  .is-active .sn-to-total1 {
    animation: sn-to-total1 6.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  .is-active .sn-to-btn {
    animation: sn-to-btn 6.5s ease-in-out infinite;
  }

  .is-active .sn-to-ripple {
    animation: sn-to-ripple 6.5s ease-out infinite;
    animation-delay: var(--d);
  }

  .is-active .sn-to-toast {
    animation: sn-to-toast 6.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  .is-active .sn-to-badge {
    animation: sn-to-badge 6.5s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
  }

  .sn-to-bob {
    animation: sn-to-bob 5s ease-in-out infinite;
    animation-delay: var(--d, 0s);
  }

  .sn-to-truck {
    animation: sn-to-drive 2.4s ease-in-out infinite;
  }

  @keyframes sn-to-float {
    50% { transform: translateY(-8px); }
  }

  @keyframes sn-to-bob {
    50% { transform: translateY(-10px); }
  }

  @keyframes sn-to-drive {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(3px); }
  }

  /* Recorrido del cursor: "Agregar" del producto → botón "Comprar" */
  @keyframes sn-to-cursor {
    0%   { opacity: 0; transform: translate(400px, 330px); }
    5%   { opacity: 1; transform: translate(400px, 330px); }
    13%  { transform: translate(212px, 217px); }
    15%  { transform: translate(212px, 217px) scale(.85); }
    17%  { transform: translate(212px, 217px); }
    25%  { transform: translate(230px, 236px); }
    44%  { transform: translate(324px, 265px); }
    46%  { transform: translate(324px, 265px) scale(.85); }
    48%  { opacity: 1; transform: translate(324px, 265px); }
    58%  { opacity: 0; transform: translate(370px, 320px); }
    100% { opacity: 0; transform: translate(370px, 320px); }
  }

  @keyframes sn-to-card {
    0%, 14%  { stroke: #1e40af; }
    17%, 92% { stroke: #38bdf8; stroke-opacity: 1; }
    97%, 100% { stroke: #1e40af; }
  }

  @keyframes sn-to-added {
    0%, 15%  { opacity: 0; transform: scale(.8); }
    19%      { opacity: 1; transform: scale(1.08); }
    22%, 92% { opacity: 1; transform: scale(1); }
    97%, 100% { opacity: 0; }
  }

  /* El producto sale de la tarjeta y cae en el carrito haciendo un arco */
  @keyframes sn-to-fly {
    0%, 16%  { opacity: 0; transform: translate(210px, 146px) scale(.6); }
    18%      { opacity: 1; transform: translate(210px, 146px) scale(1.1); }
    24%      { opacity: 1; transform: translate(290px, 70px) scale(.8); }
    30%      { opacity: .9; transform: translate(345px, 92px) scale(.3); }
    31%, 100% { opacity: 0; transform: translate(345px, 92px) scale(.2); }
  }

  @keyframes sn-to-cart {
    0%, 30%, 38%, 100% { transform: none; }
    32% { transform: rotate(-14deg) scale(1.15); }
    35% { transform: rotate(10deg); }
  }

  @keyframes sn-to-count {
    0%, 30%  { opacity: 0; transform: scale(0); }
    34%      { opacity: 1; transform: scale(1.4); }
    38%, 92% { opacity: 1; transform: scale(1); }
    97%, 100% { opacity: 0; transform: scale(0); }
  }

  @keyframes sn-to-total0 {
    0%, 31%  { opacity: 1; transform: none; }
    34%, 94% { opacity: 0; transform: translateY(-6px); }
    98%, 100% { opacity: 1; transform: none; }
  }

  @keyframes sn-to-total1 {
    0%, 32%  { opacity: 0; transform: translateY(6px); }
    36%, 92% { opacity: 1; transform: none; }
    97%, 100% { opacity: 0; }
  }

  @keyframes sn-to-btn {
    0%, 44%, 50%, 100% { transform: scale(1); filter: none; }
    46% { transform: scale(.92); filter: brightness(1.4); }
  }

  @keyframes sn-to-ripple {
    0%   { opacity: .9; transform: scale(.3); }
    8%   { opacity: 0; transform: scale(1.6); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  @keyframes sn-to-toast {
    0%, 50%  { opacity: 0; transform: translateY(16px) scale(.9); }
    56%, 92% { opacity: 1; transform: none; }
    97%, 100% { opacity: 0; transform: translateY(8px); }
  }

  @keyframes sn-to-badge {
    0%, 60%  { opacity: 0; transform: scale(.5); }
    66%, 92% { opacity: 1; transform: scale(1); }
    97%, 100% { opacity: 0; transform: scale(.8); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sn-to * {
      animation: none !important;
    }

    .sn-to-added,
    .sn-to-count,
    .sn-to-total1,
    .sn-to-toast,
    .sn-to-badge {
      opacity: 1;
      transform: none;
    }

    .sn-to-total0 {
      opacity: 0;
    }
  }
</style>
